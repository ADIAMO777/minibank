services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [backend-net]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [backend-net]

  accounts-api:
    build: ./accounts-api
    image: minibank/accounts-api:1.0
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    networks: [frontend-net, backend-net]

  transactions-api:
    build: ./transactions-api
    image: minibank/transactions-api:1.0
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      ACCOUNTS_API_URL: http://accounts-api:5000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      accounts-api: { condition: service_started }
    networks: [frontend-net, backend-net]

  notifier:
    build: ./notifier
    image: minibank/notifier:1.0
    environment:
      REDIS_URL: redis://redis:6379
      NOTIFY_CHANNEL: SMS
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend-net]

  frontend:
    build: ./frontend
    image: minibank/frontend:1.0
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on: [accounts-api, transactions-api]
    networks: [frontend-net]

networks:
  frontend-net:
  backend-net:

volumes:
  pgdata: