server {
    listen 8080;

    # Static UI
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy: the browser only talks to this container.
    location /accounts-api/ {
        proxy_pass http://accounts-api:5000/;
    }
    location /transactions-api/ {
        proxy_pass http://transactions-api:3000/;
    }
}